[package]
name = "lab-kurrentdb-rust-client"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.58", features = ["derive"] }
dotenvy = "0.15.7"
kurrentdb = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
